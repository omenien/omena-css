name: Release Plan

on:
  push:
    branches: [master]
    paths:
      - .changeset/**
      - package.json
      - pnpm-lock.yaml
      - scripts/release.sh
      - scripts/release-notes.ts
      - docs/releases/**
      - .github/workflows/release-plan.yml
  workflow_dispatch:

concurrency:
  group: release-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plan:
    # omena-ci-tier: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm omena-check run release/check/release-notes
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm omena-check run release/version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
