[package]
name = "omena-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CME-coupled bridge crate for Omena semantic graph inputs"
repository = "https://github.com/omenien/omena-css"
readme = "README.md"

[package.metadata.omena]
role = "R2"

[lints]
workspace = true

[dependencies]
omena-abstract-value = { path = "../omena-abstract-value", version = "=0.5.0" }
omena-engine-input-producers = { path = "../omena-engine-input-producers", version = "=0.5.0" }
omena-parser = { path = "../omena-parser", version = "=0.5.0" }
omena-resolver = { path = "../omena-resolver", version = "=0.5.0" }
omena-semantic = { path = "../omena-semantic", version = "=0.5.0" }
omena-sif = { path = "../omena-sif", version = "=0.5.0" }
omena-syntax = { path = "../omena-syntax", version = "=0.5.0" }
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_ast_visit = "0.147.0"
oxc_parser = "0.144.0"
oxc_semantic = "0.144.0"
oxc_span = "0.144.0"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sha2.workspace = true
sigstore-verify = { version = "0.11.0", default-features = false }
