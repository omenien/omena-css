name: Register Crate Trusted Publishers

on:
  workflow_dispatch:

concurrency:
  group: register-crate-trusted-publishers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  register:
    # omena-ci-tier: release
    name: register crates.io trusted publishers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-pinned
      - name: Register publishable crates
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: node scripts/genesis-register-trusted-publishers.mjs
