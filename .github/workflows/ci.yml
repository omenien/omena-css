name: CI

on:
  pull_request:
    branches: [master, next]
    paths-ignore:
      - .personal_docs/**
  push:
    branches: [master, next]
    paths-ignore:
      - .personal_docs/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# g131-S4: sccache kill switch — set the repository variable OMENA_SCCACHE
# to "off" to disable the compiler wrapper everywhere without a commit.
env:
  OMENA_SCCACHE: ${{ vars.OMENA_SCCACHE || 'on' }}

permissions:
  contents: read

jobs:
  preflight:
    # omena-ci-tier: verify
    # omena-ci-required: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      closure-fast-shards: ${{ steps.closure-fast-shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm omena-check doctor
      - run: pnpm omena-check run tooling/orchestrator-inventory --summary
      - run: pnpm omena-check run tooling/ci-workflow --summary
      - run: pnpm omena-check run tooling/ci-cost-ledger --summary
      - run: pnpm omena-check run rust/release-semver-intent-contract --summary
      - id: closure-fast-shards
        run: echo "matrix=$(pnpm --silent omena-check shards rust/closure-fast --json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: preflight-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  verify-core:
    # omena-ci-tier: verify
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/check --summary
      - run: pnpm omena-check bundle contract/engine-v2-contract-idl --summary
      - run: pnpm omena-check run workspace/backend-typecheck-smoke --summary
      - run: pnpm omena-check bundle docs/contracts --summary
      - run: pnpm omena-check run docs/site --summary
      - run: pnpm omena-check run docs/smoke --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-core-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  verify-native-linux:
    # omena-ci-tier: verify
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build/omena-napi --summary
      - run: pnpm omena-check run contract/parity-v2-golden --summary
      - run: pnpm omena-check run contract/type-fact-backend-parity --summary
      - run: pnpm omena-check run test/test --summary
      - run: pnpm omena-check run release/check/packaged-omena-napi-crossplatform --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-native-linux-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  build-output:
    # omena-ci-tier: verify
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-output-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  protocol-matrix:
    # omena-ci-tier: protocol
    # omena-ci-required: true
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build/omena-napi --summary
      - run: pnpm omena-check run test/protocol --summary
      - run: pnpm omena-check run release/check/packaged-omena-napi-crossplatform --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: protocol-matrix-summary-${{ matrix.os }}
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  native-runner-matrix:
    # omena-ci-required: true
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/_build-native-binaries.yml

  rust-static:
    # omena-ci-tier: rust-workspace
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run rust/workspace --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-static-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust-contracts:
    # omena-ci-tier: rust-workspace
    # omena-ci-required: true
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        contracts-shard: [public-surface, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check bundle rust/contracts --summary --shard=${{ matrix.contracts-shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-contracts-summary-${{ matrix.contracts-shard }}
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust-product-test-crates:
    # omena-ci-tier: rust-workspace
    # omena-ci-required: true
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        product-shard: [workspace, differential, benchmarks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run rust/product-test-coverage-classguard --summary
      - run: pnpm omena-check run rust/product-test-execution --summary -- ${{ matrix.product-shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-product-test-crates-summary-${{ matrix.product-shard }}
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust-product-test-contracts:
    # omena-ci-tier: rust-workspace
    # omena-ci-required: true
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        contract-shard: [api-surface, structural-shadow, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - name: Cache Rust API tools
        id: rust-api-tools-cache
        if: matrix.contract-shard == 'api-surface'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-public-api
            ~/.cargo/bin/cargo-semver-checks
          key: rust-api-tools-${{ runner.os }}-${{ runner.arch }}-public-api-0.52.0-semver-checks-0.48.0
      - name: Install Rust API tools
        if: matrix.contract-shard == 'api-surface' && steps.rust-api-tools-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-public-api@0.52.0,cargo-semver-checks@0.48.0
      - run: pnpm omena-check bundle rust/product-test-contracts --summary --shard=${{ matrix.contract-shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-product-test-contracts-summary-${{ matrix.contract-shard }}
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  resolver-path-identity-advisory:
    # omena-ci-tier: none
    # omena-ci-required: false
    needs: preflight
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: cargo test --manifest-path rust/Cargo.toml -p omena-testkit path_identity

  benchmark-contracts:
    # omena-ci-tier: verify
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run rust/benchmark/ci-reachability --summary
      - run: pnpm omena-check run rust/benchmark/emitted-css-golden-gate --summary
      - run: pnpm omena-check run rust/benchmark/headline-axis --summary
      - run: pnpm omena-check run rust/benchmark/transform-relex-baseline --summary
      - run: pnpm omena-check run rust/z5-parser-product-cutover --summary
      - run: pnpm omena-check run rust/z5-perf-per-file-invariant --summary
      - run: pnpm omena-check run rust/bundler-productization-benchmark --summary
      - run: pnpm omena-check run rust/omena-reactive/performance --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-contracts-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  benchmark-instructions:
    # omena-ci-tier: verify
    # omena-ci-required: false
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - name: Install Valgrind
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
      - run: pnpm omena-check run rust/z5-perf-baseline --summary
      - run: pnpm omena-check run rust/z5-perf-warmup-wave-count --summary
      - run: pnpm omena-check run rust/z5-perf-no-regression --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-instructions-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  benchmark-complexity:
    # omena-ci-tier: verify
    # omena-ci-required: false
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMENA_Z5_COMPLEXITY_SLOPE_REPORT: .omena-ci/z5-complexity-slope-report.json
      OMENA_DEMAND_SLICED_MONOTONE_FACT_PROPAGATION_RELOCATION_APPROVAL_REPORT: .omena-ci/demand-sliced-monotone-fact-propagation-relocation-approval.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - name: Install Valgrind
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
      - run: pnpm omena-check run rust/z5-perf-complexity-slope --summary
      - run: pnpm omena-check run rust/demand-sliced-monotone-fact-propagation-relocation-gate-bound --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-complexity-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  plugin-consumers:
    # omena-ci-tier: plugin
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - name: Resolve Chrome for plugin browser gates
        shell: bash
        run: |
          set -euo pipefail

          chrome=""
          for candidate in \
            /usr/bin/google-chrome-stable \
            /usr/bin/google-chrome \
            /usr/bin/chromium \
            /usr/bin/chromium-browser; do
            if [ -x "${candidate}" ]; then
              chrome="${candidate}"
              break
            fi
          done

          if [ -z "${chrome}" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            for candidate in /usr/bin/chromium-browser /usr/bin/chromium; do
              if [ -x "${candidate}" ]; then
                chrome="${candidate}"
                break
              fi
            done
          fi

          if [ -z "${chrome}" ]; then
            echo "::error::Unable to resolve Chrome/Chromium for plugin browser gates" >&2
            exit 1
          fi

          echo "CHROME_BIN=${chrome}" >> "$GITHUB_ENV"
          "${chrome}" --version
      - run: pnpm omena-check run plugin/consumers --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: plugin-consumers-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  closure-fast-shards:
    # omena-ci-tier: closure-fast
    # omena-ci-required: true
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.preflight.outputs.closure-fast-shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - name: Build semantic analysis native prerequisites
        if: ${{ matrix.shard == 'semantic-analysis' }}
        run: |
          cargo build --manifest-path rust/Cargo.toml -p engine-shadow-runner
          pnpm omena-check run core/build/omena-napi
      - name: Run closure-fast gates (${{ matrix.shard }} shard)
        env:
          CLOSURE_FAST_SHARD: ${{ matrix.shard }}
        run: pnpm omena-check run rust/closure-fast --summary --shard="$CLOSURE_FAST_SHARD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: closure-fast-summary-${{ matrix.shard }}
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust-identifier-authority-matrix:
    # omena-ci-tier: verify
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm omena-check run rust/omena-identifier-authority-matrix --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-identifier-authority-matrix-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  rust-identifier-authority-mutations:
    # omena-ci-tier: verify
    # omena-ci-required: true
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm omena-check run rust/omena-identifier-authority-mutations --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-identifier-authority-mutations-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  extension-host-smoke:
    # omena-ci-tier: extension-host
    # omena-ci-required: true
    needs:
      - verify-core
      - verify-native-linux
      - build-output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/
      - run: node ./scripts/restore-native-binary-permissions.mjs
      - run: xvfb-run -a pnpm omena-check run test/extension-host --summary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extension-host-smoke-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  package:
    # omena-ci-tier: package
    # omena-ci-required: true
    needs:
      - verify-core
      - verify-native-linux
      - build-output
      - native-runner-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-shadow-runner-*
          path: .runner-artifacts
      - run: pnpm omena-check run release/package/prepared --summary
        env:
          OMENA_PACKAGED_RUNNER_MIN_TARGETS: "3"
          OMENA_PACKAGED_RUNNER_REQUIRED_PLATFORMS: linux,darwin,win32
          OMENA_PACKAGED_TSGO_MIN_TARGETS: "3"
          OMENA_PACKAGED_TSGO_REQUIRED_PLATFORMS: linux,darwin,win32
          OMENA_PACKAGED_LSP_SERVER_MIN_TARGETS: "3"
          OMENA_PACKAGED_LSP_SERVER_REQUIRED_PLATFORMS: linux,darwin,win32
      - name: VSIX size gate (max 128 MB)
        run: |
          SIZE=$(wc -c < *.vsix | tr -d ' ')
          echo "VSIX size: $SIZE bytes"
          if [ "$SIZE" -gt 134217728 ]; then
            echo "::error::VSIX exceeds 128 MB budget ($SIZE bytes)"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-summary
          path: |
            .omena-ci/check-summary-*.json
            .omena-ci/check-output/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  ci-required:
    # omena-ci-required: false
    if: ${{ always() }}
    needs:
      - verify-core
      - verify-native-linux
      - build-output
      - protocol-matrix
      - native-runner-matrix
      - rust-static
      - rust-contracts
      - rust-product-test-crates
      - rust-product-test-contracts
      - benchmark-contracts
      - plugin-consumers
      - closure-fast-shards
      - rust-identifier-authority-matrix
      - rust-identifier-authority-mutations
      - extension-host-smoke
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node ./scripts/check-ci-required-results.mjs
        env:
          OMENA_CI_REQUIRED_RESULTS: ${{ toJson(needs) }}
