[package]
name = "omena-streaming-ifds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Demand-sliced monotone fact propagation scaffold for Omena LSP analysis"
repository = "https://github.com/omenien/omena-css"
readme = "README.md"

[package.metadata.omena]
role = "R1"
pillar = "theoretical-rigor"

[lints]
workspace = true

[features]
default = []
demand-sliced-monotone-fact-propagation = []
# compatibility-owner: omena-streaming-ifds maintainers
# compatibility-removal: not before 1.0, and only after downstream migration and audited zero in-repo non-compat uses
streaming-ifds = ["demand-sliced-monotone-fact-propagation"]
with-frame-rule = []

[dependencies]
omena-abstract-value = { path = "../omena-abstract-value", version = "=0.3.0" }
omena-cross-file-summary = { path = "../omena-cross-file-summary", version = "=0.3.0" }
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
