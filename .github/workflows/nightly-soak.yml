name: Nightly Soak

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-api:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build/omena-napi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
          retention-days: 1
          if-no-files-found: error
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / native-api"
          body: |
            The shared nightly Linux NAPI build failed.
          workflow-name: Nightly Soak
          job-name: native-api
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  vite-bundler-host-hmr:
    needs: native-api
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
      - name: Resolve Chrome for Vite browser gate
        shell: bash
        run: |
          set -euo pipefail
          chrome=""
          for candidate in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "${candidate}" ]; then
              chrome="${candidate}"
              break
            fi
          done
          if [ -z "${chrome}" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            for candidate in /usr/bin/chromium-browser /usr/bin/chromium; do
              if [ -x "${candidate}" ]; then
                chrome="${candidate}"
                break
              fi
            done
          fi
          test -n "${chrome}"
          echo "CHROME_BIN=${chrome}" >> "$GITHUB_ENV"
          "${chrome}" --version
      - run: pnpm omena-check run plugin/vite-plugin-hmr
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / vite-bundler-host-hmr"
          body: |
            The scheduled Vite bundler-host browser HMR lane failed.
          workflow-name: Nightly Soak
          job-name: vite-bundler-host-hmr
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  sdk-cross-surface-parity:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/setup-wasm-pack
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm omena-check run rust/omena-cross-surface-parity-full
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / sdk-cross-surface-parity"
          body: |
            The scheduled SDK cross-surface parity lane failed.
          workflow-name: Nightly Soak
          job-name: sdk-cross-surface-parity
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  tsgo-operational:
    needs: native-api
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
      - run: pnpm omena-check run tsgo/release-batch
      - run: pnpm omena-check run tsgo/real-project-corpus
      - run: pnpm omena-check run tsgo/lsp-server-smoke
      - run: pnpm omena-check bundle tsgo/operational/lane
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / tsgo-operational"
          body: |
            The scheduled TS Go operational lane failed.
          workflow-name: Nightly Soak
          job-name: tsgo-operational
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  ts7-phase-a:
    needs: native-api
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
      - run: pnpm omena-check bundle ts7/phase-a/readiness
      - run: pnpm omena-check bundle ts7/phase-a/shadow
      - run: pnpm omena-check run ts7/phase-a/stability
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / ts7-phase-a"
          body: |
            The scheduled TS7 phase-A lane failed.
          workflow-name: Nightly Soak
          job-name: ts7-phase-a
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  selected-query-default:
    needs: native-api
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
      - run: pnpm omena-check run rust/selected-query/default-candidate
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / selected-query-default"
          body: |
            The scheduled selected-query default-candidate lane failed.
          workflow-name: Nightly Soak
          job-name: selected-query-default
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  checker-release-gate:
    needs: native-api
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
      - run: pnpm omena-check run rust/checker/release-gate-shadow
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / checker-release-gate"
          body: |
            The scheduled checker release-gate shadow lane failed.
          workflow-name: Nightly Soak
          job-name: checker-release-gate
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  sass-spec-conformance:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run rust/omena-diff-test-sass-spec-import
      - run: pnpm omena-check run rust/omena-diff-test-sass-spec-oracle
      - run: pnpm omena-check run rust/omena-diff-test-sass-spec-upstream-scale-fetch
      - run: pnpm omena-check run rust/omena-diff-test-sass-spec-scale
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / sass-spec-conformance"
          body: |
            The scheduled sass-spec conformance lane failed.
          workflow-name: Nightly Soak
          job-name: sass-spec-conformance
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  oss-corpus-farm:
    needs: native-api
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-omena-napi-linux-x64
          path: rust/crates/omena-napi/pkg/
      - run: pnpm omena-check run rust/oss-corpus-farm
        env:
          OMENA_OSS_CORPUS_CAPTURE_RAW: "1"
          OMENA_OSS_CORPUS_CAPTURE_DIR: .omena-oss-corpus-farm-captures
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / oss-corpus-farm"
          body: |
            The scheduled OSS corpus farm lane failed. Raw reproducer fixtures
            are captured when the checker reaches a reproducible corpus failure.
          workflow-name: Nightly Soak
          job-name: oss-corpus-farm
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oss-corpus-farm-raw-reproducers
          path: .omena-oss-corpus-farm-captures
          if-no-files-found: ignore

  demand-sliced-monotone-fact-propagation-settle-soak:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMENA_Z5_COMPLEXITY_SLOPE_REPORT: .omena-ci/z5-complexity-slope-report.json
      OMENA_DEMAND_SLICED_MONOTONE_FACT_PROPAGATION_RELOCATION_APPROVAL_REPORT: .omena-ci/demand-sliced-monotone-fact-propagation-relocation-approval.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          valgrind --version
      - run: pnpm omena-check run rust/benchmark/ci-reachability
      - run: pnpm omena-check run rust/z5-perf-complexity-slope
      - run: pnpm omena-check run rust/demand-sliced-monotone-fact-propagation-relocation-gate-bound
      - run: pnpm omena-check run rust/demand-sliced-monotone-fact-propagation-settle-soak
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / demand-sliced-monotone-fact-propagation-settle-soak"
          body: |
            The scheduled demand-sliced monotone fact propagation settle soak lane failed.
          workflow-name: Nightly Soak
          job-name: demand-sliced-monotone-fact-propagation-settle-soak
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # g131-S5 (D-CI-1 option b): the three demoted push lanes run here nightly
  # with hard failure-escalation; on push CI they remain advisory (outside
  # ci-required). Demoted set = benchmark-instructions + benchmark-complexity
  # (the valgrind poles) + the windows protocol leg. native-runner windows is
  # NOT demotable (the package lane asserts the 3-leg native matrix).
  benchmark-instructions:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run rust/z5-perf-baseline --summary
      - run: pnpm omena-check run rust/z5-perf-warmup-wave-count --summary
      - run: pnpm omena-check run rust/z5-perf-no-regression --summary
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / benchmark-instructions"
          body: |
            The nightly hard-run of the demoted z5 instruction-count lanes failed.
            These are advisory on push CI (D-CI-1 option b) — this issue is the
            blocking signal.
          workflow-name: Nightly Soak
          job-name: benchmark-instructions
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  benchmark-complexity:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run rust/z5-perf-complexity-slope --summary
      - run: pnpm omena-check run rust/demand-sliced-monotone-fact-propagation-relocation-gate-bound --summary
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / benchmark-complexity"
          body: |
            The nightly hard-run of the demoted complexity-slope lanes failed.
            These are advisory on push CI (D-CI-1 option b) — this issue is the
            blocking signal.
          workflow-name: Nightly Soak
          job-name: benchmark-complexity
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  protocol-windows:
    permissions:
      contents: read
      issues: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/sync-release-metadata
      - run: pnpm omena-check run core/build/omena-napi --summary
      - run: pnpm omena-check run test/protocol --summary
      - run: pnpm omena-check run release/check/packaged-omena-napi-crossplatform --summary
      - name: Escalate scheduled failure
        if: ${{ failure() }}
        uses: ./.github/actions/escalate-ci-failure
        with:
          title: "CI failure: nightly-soak / protocol-windows"
          body: |
            The nightly hard-run of the demoted windows protocol leg failed.
            It is no longer on push CI (D-CI-1 option b) — this issue is the
            blocking signal.
          workflow-name: Nightly Soak
          job-name: protocol-windows
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # NOTE: rust/omena-css/h1-readiness runs once nightly in omena-css-drift.yml
  # (08:00, green there). The duplicate 90-min soft run that lived here was removed
  # to stop running the same composite twice an hour apart (CI-hardening N7 dedup).
  #
  # The chronic nightly-soak red (~2026-06-01..06-14) was the checker-release-gate
  # job, NOT a cargo-fuzz flake. It was a 3-check chain of drift that ONLY this
  # nightly release bundle runs (not PR/push CI), so it sat red for ~2 weeks:
  #   1. check-rust-omena-syntax-parser-cst-equivalence.ts — asserted parser symbols
  #      (`syntax()`, ParserCstEquivalenceSummaryV0, ...) in omena-parser/src/lib.rs,
  #      but a module split moved them to parse.rs/summaries.rs. Fixed: scan whole crate.
  #   2. check-rust-omena-syntax-extraction-decision.ts — same lib.rs-only drift. Fixed: same.
  #   3. check-rust-omena-cli-soundiness-report.ts — stale FIXTURE: it expected an
  #      unresolved `@use` to yield a suppressible `missingSassSymbol`, but per omena-cli
  #      #33 an unreadable external edge now surfaces only `unresolvedExternalReference`
  #      (intended, not a regression). Fixed: suppress a LOCAL undefined Sass var instead.
