name: Documentation Pages

on:
  push:
    branches:
      - master
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "rust/crates/omena-wasm/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/actions/setup-pnpm/**"
      - ".github/actions/setup-wasm-pack/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/setup-wasm-pack
      - name: Add the browser WASM target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.96.0
      - name: Build the browser runtime
        run: pnpm --filter @omena/docs build:wasm
      - name: Export the static documentation site
        run: pnpm --filter @omena/docs build
      - name: Verify the exported site
        run: pnpm omena-check run docs/smoke
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
