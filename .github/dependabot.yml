# Dependabot keeps the SHA-pinned GitHub Actions, the Cargo workspace, and the
# pnpm workspace up to date. The repo pins every action to a commit SHA for
# supply-chain integrity (doc 12 §10). Dependabot updates authored workflows and
# composites; generated-workflow pins move through their canonical registry.
# Updates are grouped to keep PR volume low for a solo + AI-agent workflow.
#
# `cooldown` holds a freshly-released version for a few days before proposing it,
# so a compromised release (the npm "Shai-Hulud" worm class) has time to be caught
# and yanked before we pull it. This is the cheap, low-maintenance substitute for
# cargo-vet hard-gating (doc 13 §10 / the CI-hardening research pass).
version: 2
updates:
  # GitHub Actions: authored workflows plus the .github/actions/* composites.
  - package-ecosystem: github-actions
    directory: "/"
    # ci.yml is generated from the check-orchestrator registry. External actions
    # used there are either wrapped by a local composite or updated manually in
    # the registry; a bot edit to the generated file alone is never authoritative.
    exclude-paths:
      - ".github/workflows/ci.yml"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Cargo workspace (rust/). SHA-pinned toolchain is separate (rust-toolchain.toml);
  # this tracks the crate dependency graph behind the published train.
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      # The six direct OXC crates are one API family. Dependabot has repeatedly
      # split them into incompatible PRs, so maintainers update all six pins and
      # the lockfile together under the tool-pin coherence gate.
      - dependency-name: "oxc_*"
      - dependency-name: "oxc-*"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # rust/fuzz is a SEPARATE Cargo workspace (omena-css-fuzz, its own [workspace]
  # + Cargo.lock, not a member of /rust) — needs its own updater or libfuzzer-sys
  # and its transitive deps rot silently.
  - package-ecosystem: cargo
    directory: "/rust/fuzz"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      cargo-fuzz-minor-patch:
        update-types:
          - minor
          - patch

  # pnpm workspace (root pnpm-lock.yaml covers all workspace packages).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      # VS Code types are locked to the minimum supported editor. Raising the
      # engine floor is a product decision, so this dependency is manual-only.
      - dependency-name: "@types/vscode"
      # tsgo nightlies have regressed the type-fact protocol twice (20260606.1,
      # 20260609.1 — hover contents.value null / finiteSet→none). Bump manually,
      # gated by check-rust-omena-lsp-server-type-fact-protocol and
      # check-explain-expression-query-consumer.
      - dependency-name: "@typescript/native-preview"
      # dart-sass is the byte-exact oracle for the sass-spec corpus: the version
      # is pin-asserted by check-rust-omena-diff-test-sass-spec-oracle and a bump
      # requires a deliberate oracle re-capture. Bump manually with the recapture.
      - dependency-name: "sass"
      # Release packaging rewrites these source placeholders to the selected
      # crate-train version. Registry versions are not source dependency pins.
      - dependency-name: "@omena/napi"
      - dependency-name: "@omena/wasm"
      # OXC tools move under one exact-pin gate with the Rust OXC crate family;
      # a bot-only root bump leaves the plugin peer pin stale.
      - dependency-name: "oxlint"
      - dependency-name: "oxfmt"
      - dependency-name: "vite-plus"
      # TanStack Start packages expose one cross-package type surface, and the
      # static server-functions package carries a local base-path patch. Update
      # the trio together and rebase the patch before accepting a new version.
      - dependency-name: "@tanstack/react-router"
      - dependency-name: "@tanstack/react-start"
      - dependency-name: "@tanstack/start-static-server-functions"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        # `ignore` is the update authority; these exclusions also prevent a
        # fallback group from absorbing a sensitive package if bot behavior or
        # an existing branch predates the ignore rule.
        exclude-patterns:
          - "@types/vscode"
          - "@typescript/native-preview"
          - "sass"
          - "@omena/napi"
          - "@omena/wasm"
          - "oxlint"
          - "oxfmt"
          - "vite-plus"
          - "@tanstack/react-router"
          - "@tanstack/react-start"
          - "@tanstack/start-static-server-functions"
          - "@oxc/*"
          - "oxc-*"
        update-types:
          - minor
          - patch
