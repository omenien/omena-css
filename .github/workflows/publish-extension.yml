name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish"
        required: true
        default: "master"
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - preview
      publish_marketplace:
        description: "Publish to VS Code Marketplace"
        required: true
        default: true
        type: boolean
      publish_openvsx:
        description: "Publish to Open VSX"
        required: true
        default: true
        type: boolean
      create_github_release:
        description: "Create a GitHub release"
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-extension-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-runner-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/_build-native-binaries.yml
    with:
      ref: ${{ github.event.inputs.ref }}
      retention-days: 7

  publish:
    # omena-ci-tier: release
    needs: native-runner-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_CHANNEL: ${{ github.event.inputs.channel }}
      RELEASE_REF: ${{ github.event.inputs.ref }}
      PUBLISH_MARKETPLACE: ${{ github.event.inputs.publish_marketplace }}
      PUBLISH_OPENVSX: ${{ github.event.inputs.publish_openvsx }}
      OMENA_PACKAGED_RUNNER_MIN_TARGETS: "3"
      OMENA_PACKAGED_RUNNER_REQUIRED_PLATFORMS: linux,darwin,win32
      OMENA_PACKAGED_TSGO_MIN_TARGETS: "3"
      OMENA_PACKAGED_TSGO_REQUIRED_PLATFORMS: linux,darwin,win32
      OMENA_PACKAGED_LSP_SERVER_MIN_TARGETS: "3"
      OMENA_PACKAGED_LSP_SERVER_REQUIRED_PLATFORMS: linux,darwin,win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
      - name: Verify publication checkout matches provenance source
        env:
          OMENA_PROVENANCE_SOURCE_SHA: ${{ github.sha }}
        run: node ./scripts/check-publish-provenance-source.mjs
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-rust-pinned
      - uses: ./.github/actions/cache-rust
        with:
          shared-key: publish-extension-napi
      # The checked-out release ref can predate this workflow repair. Build its
      # current NAPI binding before the release script runs tests that require
      # the Rust source frontend.
      - name: Build omena-napi for release verification
        run: pnpm omena-check run core/build/omena-napi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-shadow-runner-*
          path: .runner-artifacts
      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ "${RELEASE_CHANNEL}" = "preview" ]; then
            TAG="vscode-v${VERSION}-preview.${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
            NAME="Omena CSS Modules v${VERSION} Preview"
          else
            TAG="vscode-v${VERSION}"
            PRERELEASE=false
            NAME="Omena CSS Modules v${VERSION}"
          fi
          TARGET_COMMIT="$(git rev-parse "${RELEASE_REF}^{commit}")"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "name=${NAME}"
            echo "target_commit=${TARGET_COMMIT}"
          } >> "$GITHUB_OUTPUT"
      - name: Render canonical release notes
        run: pnpm omena-check run release/release/notes -- --tag "${{ steps.meta.outputs.tag }}" --output release-notes.md
      - name: Format canonical release notes
        run: pnpm exec oxfmt --write release-notes.md
      - run: ./scripts/publish-extension.sh
        env:
          OMENA_RELEASE_NAPI_READY: "true"
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Generate SBOM
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format json --output-file sbom.json 2> cyclonedx-npm.log
          node -e 'const fs = require("node:fs"); const sbom = JSON.parse(fs.readFileSync("sbom.json", "utf8")); const components = sbom.components?.length ?? 0; if (components === 0) throw new Error("Generated SBOM has no components"); console.log("Generated SBOM: " + components + " components");'
      - name: Upload release artifacts
        if: github.event.inputs.create_github_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-release-${{ github.run_id }}
          path: |
            *.vsix
            sbom.json
            cyclonedx-npm.log
      - name: Attest build provenance for VSIX
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.vsix"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: github.event.inputs.create_github_release == 'true'
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ steps.meta.outputs.target_commit }}
          body_path: release-notes.md
          files: |
            *.vsix
            sbom.json
      - name: Verify persisted GitHub Release notes
        if: github.event.inputs.create_github_release == 'true'
        run: pnpm omena-check run release/release/notes -- verify-github --tag "${{ steps.meta.outputs.tag }}" --file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
