name: Documentation Pages

on:
  push:
    branches:
      - master
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "rust/crates/omena-wasm/**"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/actions/setup-pnpm/**"
      - ".github/actions/setup-wasm-pack/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/cache-rust
      - uses: ./.github/actions/setup-wasm-pack
      - name: Add the browser WASM target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.96.0
      - name: Build the browser runtime
        run: pnpm --filter @omena/docs build:wasm
      - name: Export the static documentation site
        run: pnpm --filter @omena/docs build
        env:
          OMENA_DOCS_BASE_PATH: /omena-css
      - name: Verify the exported site
        run: pnpm omena-check run docs/smoke
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
