name: Setup wasm-pack
description: Install the pinned wasm-pack used to build the @omena/wasm npm package.
inputs:
  version:
    description: wasm-pack version to install.
    required: false
    default: "0.13.1"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WASM_PACK_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        expected="wasm-pack ${WASM_PACK_VERSION}"
        if wasm-pack --version 2>/dev/null | grep -Fq "$expected"; then
          echo "$expected already installed"
          exit 0
        fi

        cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
