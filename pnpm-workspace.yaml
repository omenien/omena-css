packages:
  - "."
  - "apps/*"
  - "packages/*"
  - "client"
  - "examples"
  - "server"
  - "shared"

# Keep transitive packages above published security-fix floors even when an
# upstream tool still admits a vulnerable version through a broad range.
overrides:
  "@types/node": "26.3.0"
  "@vitest/mocker@>=4.0.0 <4.1.12": "4.1.12"
  "colord@<2.9.4": "2.9.4"
  "compression@>=1.0.0 <1.8.2": "1.8.2"
  "markdown-it@>=14.0.0 <14.3.3": "14.3.3"
  "postcss-selector-parser@>=7.0.0 <7.1.6": "7.1.6"
  "qs@>=6.0.0 <6.16.0": "6.16.0"
  "tinypool@>=2.0.0 <2.1.2": "2.1.2"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "linkify-it@>=5.0.0 <5.0.2": "5.0.2"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "next@>=16.0.0 <16.3.1": "16.3.1"
  "postcss@>=8.0.0 <8.5.23": "8.5.26"
  "sharp@>=0.34.0 <0.35.0": "0.35.3"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
  "vite@>=8.0.0 <8.0.16": "8.2.2"

patchedDependencies:
  # Keep static server-function cache requests inside the configured router base path.
  "@tanstack/start-static-server-functions@1.167.40": patches/@tanstack__start-static-server-functions@1.167.40.patch
