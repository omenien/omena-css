[package]
name = "omena-lawvere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transform-pass catalog and reorderability metadata scaffold for Omena CSS"
repository = "https://github.com/omenien/omena-css"
readme = "README.md"

[package.metadata.omena]
role = "R1"
pillar = "theoretical-rigor"

[lints]
workspace = true

[features]
default = []
transform-catalog-saturation = []
# compatibility-owner: omena-lawvere maintainers
# compatibility-removal: not before 1.0, and only after downstream migration and audited zero in-repo non-compat uses
lawvere-saturation = ["transform-catalog-saturation"]

[dependencies]
omena-evidence-graph = { path = "../omena-evidence-graph", version = "=0.3.0" }
omena-transform-cst = { path = "../omena-transform-cst", version = "=0.3.0" }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
